name: required-proposals
# Entry point for a future org ruleset on aave-proposals-v3-style repos:
# add this as a required status check once a repo-ruleset workflow exists.
# Not used by the halnation trial (halnation has no rulesets) -- the trial
# calls proposal-checks.yml directly from a normal caller workflow instead.
on:
  pull_request:
  merge_group:
jobs:
  proposal-checks:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: "halnation/github-workflows/.github/workflows/proposal-checks.yml@<github-workflows commit SHA>" # REQUIRED: pin to the reviewed github-workflows commit
    with:
      min_coverage: 100
      workflows_ref: "<github-workflows commit SHA>" # REQUIRED: same commit as the pin above
      backend: openrouter
      dry_run: true
    secrets:
      RPC_MAINNET: ${{ secrets.RPC_MAINNET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
