name: ai-comment
on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      backend:
        type: string
        default: anthropic
      dry_run:
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      BOARD_APP_PRIVATE_KEY:
        required: false
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ai-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
env:
  DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
  AI_OUTPUT_CAP: "20000"
  MARKER: "<!-- github-workflows-ai -->"
jobs:
  collect:
    if: >-
      github.event.repository.private &&
      (inputs.kind != 'review' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      number: ${{ steps.gate.outputs.number }}
    steps:
      - name: Resolve subject and recency gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          number="${PR_NUMBER:-$ISSUE_NUMBER}"
          cutoff=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)
          last=$(gh api --paginate "repos/$REPO/issues/$number/comments" | jq -rs --arg m "$MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.updated_at]|max // empty')
          if [ -z "$last" ] || [[ "$last" < "$cutoff" ]]; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint read-only app token for cross-repo issue lookup
        id: mint
        if: steps.gate.outputs.number != '' && inputs.kind == 'review'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},General-Task
          permission-pull-requests: read
          permission-issues: read
          permission-contents: read
      - name: Collect the subject
        if: steps.gate.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.gate.outputs.number }}
          KIND: ${{ inputs.kind }}
          BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$KIND" = "review" ]; then
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            gh api "repos/$REPO/pulls/$NUMBER" -H "Accept: application/vnd.github.v3.diff" > diff.txt
            issue_body=$(GH_TOKEN="$ISSUE_TOKEN" gh api graphql -f query='
              query($owner:String!,$name:String!,$num:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$num){
                    closingIssuesReferences(first:1){ nodes{ body } }
                  }
                }
              }' -f owner="$owner" -f name="$name" -F num="$NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].body // empty')
            {
              echo "<linked-issue>"
              if [ -n "$issue_body" ]; then printf '%s\n' "$issue_body"; else echo "(no linked issue)"; fi
              echo "</linked-issue>"
              echo "<pr-diff>"
              awk '
                function flush() {
                  if (path != "") {
                    skip = (path ~ /(^|\/)(lib|broadcast|out|cache|node_modules)\//) \
                        || (path ~ /\.lock$/) \
                        || (path ~ /(^|\/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$/)
                    if (skip) print "(" path ": " count " lines changed, omitted)"
                    else print buf
                  }
                }
                /^diff --git / {
                  flush()
                  path = $3
                  sub(/^a\//, "", path)
                  buf = $0
                  count = 0
                  next
                }
                {
                  buf = buf "\n" $0
                  if ($0 ~ /^[+-]/ && $0 !~ /^(\+\+\+|---)/) count++
                  next
                }
                END { flush() }
              ' diff.txt
              echo "</pr-diff>"
            } > input.txt
          else
            printf '%s' "$BODY" > input.txt
          fi
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: steps.gate.outputs.number != ''
        with:
          name: ai-input
          path: input.txt
  generate:
    needs: collect
    if: needs.collect.outputs.number != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: halnation/github-workflows/.github/actions/scripts@main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-input
      - name: Run ai.py
        env:
          ANTHROPIC_API_KEY: ${{ inputs.backend == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          AI_API_STYLE: ${{ inputs.backend == 'openrouter' && 'openai' || 'anthropic' }}
          AI_API_URL: ${{ inputs.backend == 'openrouter' && 'https://openrouter.ai/api/v1/chat/completions' || '' }}
          AI_API_KEY: ${{ inputs.backend == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          AI_MODEL: ${{ inputs.backend == 'openrouter' && vars.OPENROUTER_MODEL || '' }}
          KIND: ${{ inputs.kind }}
          BACKEND: ${{ inputs.backend }}
        run: |
          case "$KIND" in review|scope) ;; *) echo "bad kind: $KIND"; exit 1;; esac
          case "$BACKEND" in anthropic|openrouter) ;; *) echo "bad backend: $BACKEND"; exit 1;; esac
          python3 "$GW/ai.py" "$KIND" input.txt out.md
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ai-output
          path: out.md
  post:
    needs: [collect, generate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-output
      - uses: halnation/github-workflows/.github/actions/scripts@main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cap and post comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.collect.outputs.number }}
        run: |
          if [ "${DRY_RUN:-1}" != "0" ]; then
            jq -nc --arg n "$NUMBER" '{would:"ai-comment",number:$n}' >&2
            exit 0
          fi
          # Rendered markdown, not a ```text fence -- sanitize.py (shared with
          # proposal-checks' advisory comment) is what makes that safe.
          body=$(python3 "$GW/sanitize.py" out.md "$AI_OUTPUT_CAP")
          {
            printf '%s\n' "$MARKER"
            echo "**AI note (advisory, not a review)**"
            printf '%s\n' "$body"
          } > comment.md
          existing=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" | jq -rs --arg m "$MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.id]|max // empty')
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@comment.md
          else
            gh api "repos/$REPO/issues/$NUMBER/comments" -X POST -F body=@comment.md
          fi
