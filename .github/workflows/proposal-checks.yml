name: proposal-checks
# Blocking: address-book (#5), spelling (#2), coverage (#4).
# Advisory (never blocks): forum-vs-diff spec check (#3) + decimals sanity (#1),
# posted as one PR comment, AI output never treated as approval.
on:
  workflow_call:
    inputs:
      min_coverage:
        type: number
        default: 100
      workflows_ref:
        required: true
        type: string
      backend:
        type: string
        default: openrouter
      dry_run:
        type: boolean
        default: true
    secrets:
      RPC_MAINNET:
        required: false
      OPENROUTER_API_KEY:
        required: false
permissions: {}
defaults:
  run:
    shell: bash
env:
  MARKER: "<!-- github-workflows-proposal-spec -->"
jobs:
  address-book:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      details: ${{ steps.check.outputs.details }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: New raw addresses must exist in the address book
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Scope: src/**/*.sol, excluding *.t.sol (test whale/claimer addresses are noise).
          # Addresses that appear only on a `//` comment line (e.g. an explorer link) are
          # ignored -- they document an address, they don't use one on-chain.
          # Upstream aave-proposals-v3 pins aave-address-book only as a nested
          # submodule of aave-helpers (lib/aave-helpers/lib/aave-address-book) -- a
          # second, independently-pinned top-level copy caused a real forge remapping
          # clash against aave-helpers' own ProtocolV3TestBase in the trial build, so
          # this replica follows upstream's single-copy layout.
          book=$(find lib/aave-helpers/lib/aave-address-book -name '*.sol' -o -name '*.ts' 2>/dev/null)
          if [ -z "$book" ]; then
            echo "lib/aave-helpers/lib/aave-address-book not found; is the submodule checked out recursively?"; exit 1
          fi
          book_text=$(cat $book)
          fail=0
          details=""
          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            file="${hit%%:*}"
            rest="${hit#*:}"
            lineno="${rest%%:*}"
            addr="${rest#*:}"
            addr_lc=$(echo "$addr" | tr 'A-F' 'a-f')
            if ! echo "$book_text" | tr 'A-F' 'a-f' | grep -qF "$addr_lc"; then
              echo "::error file=$file,line=$lineno::raw address $addr not found in lib/aave-address-book -- use the AaveVX.NAME constant or add it to the address book"
              details="${details}${file}:${lineno}: raw address ${addr} not in the address book$(printf '\n')"
              fail=1
            fi
          done < <(
            git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- 'src/**/*.sol' ':!src/**/*.t.sol' \
              | awk '
                  /^\+\+\+ b\// { file=substr($0,7); next }
                  /^@@/ { split($0,a,"+"); split(a[2],b,","); line=b[1]+0; next }
                  /^\+/ {
                    content = substr($0,2)
                    sub(/\/\/.*/, "", content)
                    if (match(content, /0x[0-9a-fA-F]{40}/)) {
                      print file ":" line ":" substr(content, RSTART, RLENGTH)
                    }
                    line++
                    next
                  }
                '
          )
          {
            echo "details<<ADDRESSBOOK_EOF"
            printf '%s' "$details"
            echo "ADDRESSBOOK_EOF"
          } >> "$GITHUB_OUTPUT"
          [ "$fail" -eq 0 ] && echo "no new unrecognized addresses"
          exit $fail

  spelling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      details: ${{ steps.check.outputs.details }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: .gh-workflows-config
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: cspell on changed proposal .md files
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Picked cspell over rojopolis/spellcheck-github-actions: rojopolis'
          # pyspelling config takes static source globs, so limiting it to only
          # this PR's changed files means rewriting its config every run.
          # cspell takes a file list straight from argv, so `git diff
          # --name-only` feeds it directly, and -c points at config that lives
          # in github-workflows (checked out above), not duplicated per repo.
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'src/**/*.md')
          if [ -z "$files" ]; then
            echo "no changed proposal .md files"; exit 0
          fi
          set +e
          npx -y cspell@9.2.1 --no-progress -c .gh-workflows-config/cspell.json $files > cspell-out.txt 2>&1
          status=$?
          set -e
          cat cspell-out.txt
          {
            echo "details<<CSPELL_EOF"
            [ "$status" -ne 0 ] && grep -E '^[^ ].*:[0-9]+:[0-9]+' cspell-out.txt | head -15
            echo "CSPELL_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $status

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pct: ${{ steps.gate.outputs.pct }}
      uncovered_sample: ${{ steps.gate.outputs.uncovered_sample }}
      min_coverage: ${{ inputs.min_coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: aave-dao/github-workflows/.github/actions/foundry-setup@f3d4a12c202dcfbea2f34928e730dd53d61d91f6
      - run: forge build --deny notes
        env:
          RPC_MAINNET: ${{ secrets.RPC_MAINNET }}
      - name: Coverage threshold (payload contracts only)
        id: gate
        uses: halnation/github-workflows/.github/actions/coverage-gate@<github-workflows commit SHA> # REQUIRED: pin to the reviewed github-workflows commit
        with:
          min_coverage: ${{ inputs.min_coverage }}
          path_prefix: "src/"
          exclude_suffixes: ".t.sol scripts/"
          no_match_test: "test_defaultProposalExecution"
        env:
          RPC_MAINNET: ${{ secrets.RPC_MAINNET }}

  advisory:
    runs-on: ubuntu-latest
    if: github.event.repository.private
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      comment_url: ${{ steps.post.outputs.comment_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: aave-dao/github-workflows/.github/actions/foundry-setup@f3d4a12c202dcfbea2f34928e730dd53d61d91f6
      - name: Recency gate
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cutoff=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)
          last=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" | jq -rs --arg m "$MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.updated_at]|max // empty')
          if [ -z "$last" ] || [[ "$last" < "$cutoff" ]]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Find the changed proposal folder
        id: folder
        if: steps.gate.outputs.run == '1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The changed proposal folder is whichever src/<folder>/ has ANY changed
          # file (.sol/.t.sol/.md) -- a case that only edits the payload .sol (no .md
          # change) must still resolve to that folder's (unchanged) .md, or the
          # advisory step has nothing to compare against and silently no-ops.
          dir=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'src/*/*' | head -1 | xargs -r dirname)
          if [ -z "$dir" ]; then
            echo "no changed proposal folder in this PR; skipping advisory step"
            echo "md=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          md=$(find "$dir" -maxdepth 1 -name '*.md' | head -1)
          if [ -z "$md" ]; then
            echo "changed folder $dir has no .md; skipping advisory step"
            echo "md=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "md=$md" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Fetch forum raw text
        id: forum
        if: steps.folder.outputs.md != ''
        run: |
          url=$(sed -n 's/^discussions:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' "${{ steps.folder.outputs.md }}" | head -1)
          topic=$(echo "$url" | grep -oE '[0-9]+/?$' | tr -d '/')
          if [ -z "$topic" ]; then
            echo "could not parse a topic id from discussions: $url"; echo "" > forum.txt
          else
            curl -fsSL "https://governance.aave.com/raw/$topic/1" -o forum.txt || echo "(forum fetch failed)" > forum.txt
          fi
      - name: Generate the fork diff report
        id: diff
        if: steps.folder.outputs.md != ''
        env:
          RPC_MAINNET: ${{ secrets.RPC_MAINNET }}
        run: |
          # Like upstream aave-proposals-v3, the author commits diffs/*.md
          # generated locally by the fork test -- so check the committed repo
          # state FIRST, and only fall back to regenerating in CI (which needs
          # --isolate, not just the forge-config annotation, for
          # ProtocolV3TestBase.defaultTest's payload gas-limit check to pass;
          # without it the check reverts before diffReports() ever writes a
          # file) when nothing was committed.
          proposal_name=$(basename "${{ steps.folder.outputs.dir }}" | sed -E 's/^[0-9]{8}_//')
          committed=$(find diffs -name "*${proposal_name}*.md" 2>/dev/null | sort | tail -1 || true)
          if [ -n "$committed" ]; then
            echo "using committed diff report: $committed"
            echo "report=$committed" >> "$GITHUB_OUTPUT"
            echo "source=committed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "no committed diff report found for $proposal_name; regenerating in CI"
          forge test --match-path "${{ steps.folder.outputs.dir }}/*.t.sol" --isolate -vv || true
          mkdir -p diffs
          report=$(find diffs -newer "${{ steps.folder.outputs.md }}" -name '*.md' 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            report=$(find diffs -name '*.md' 2>/dev/null | sort | tail -1 || true)
          fi
          echo "report=${report:-}" >> "$GITHUB_OUTPUT"
          echo "source=regenerated" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: steps.diff.outputs.source == 'regenerated' && steps.diff.outputs.report != ''
        with:
          name: regenerated-diffs
          path: diffs/
      - name: Build AI input
        if: steps.folder.outputs.md != ''
        run: |
          {
            echo "<forum>"; cat forum.txt; echo "</forum>"
            echo "<proposal-md>"; cat "${{ steps.folder.outputs.md }}"; echo "</proposal-md>"
            echo "<diff-report>"
            [ -n "${{ steps.diff.outputs.report }}" ] && cat "${{ steps.diff.outputs.report }}"
            echo "</diff-report>"
          } > input.txt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.folder.outputs.md != ''
        with:
          repository: ${{ github.repository_owner }}/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: .gh-workflows-ai
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.folder.outputs.md != ''
        with:
          python-version: "3.12"
      - name: Run spec-check AI call
        if: steps.folder.outputs.md != ''
        env:
          DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
          AI_API_STYLE: openai
          AI_API_URL: https://openrouter.ai/api/v1/chat/completions
          AI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.OPENROUTER_MODEL }}
          AI_MAX_TOKENS: "8000"
        run: |
          # This is an advisory-only step: an AI-side failure (truncation, API
          # error, timeout) must never turn the job red -- under a ruleset that
          # would block a merge on the AI provider's flakiness, not on anything
          # about the proposal. Log the failure into the comment instead.
          cd .gh-workflows-ai
          if ! python3 ai.py spec-check ../input.txt ../ai-out.md; then
            echo "_AI call failed (see job log for the reason); no spec-check table was generated for this run._" > ../ai-out.md
          fi
      - name: Deterministic decimals-scale check
        if: steps.folder.outputs.md != ''
        run: |
          if [ -n "${{ steps.diff.outputs.report }}" ]; then
            python3 .gh-workflows-ai/scale_check.py "${{ steps.diff.outputs.report }}" > scale-out.txt || true
          else
            echo "no diff report was generated for this proposal; decimals-scale check skipped" > scale-out.txt
          fi
      - name: Post one advisory comment
        id: post
        if: steps.folder.outputs.md != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
          DIFF_SOURCE: ${{ steps.diff.outputs.source }}
        run: |
          if [ "$DRY_RUN" != "0" ]; then
            jq -nc --arg n "$NUMBER" '{would:"proposal-spec-comment",number:$n}' >&2
            exit 0
          fi
          python3 .gh-workflows-ai/render_advisory_comment.py ai-out.md scale-out.txt body.md
          if [ "$DIFF_SOURCE" = "committed" ]; then
            diff_note="_Diff report: committed by the author._"
          else
            diff_note="_Diff report: regenerated in CI (none was committed)._"
          fi
          { printf '%s\n' "$MARKER"; printf '%s\n\n' "$diff_note"; cat body.md; } > comment.md
          existing=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" | jq -rs --arg m "$MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.id]|max // empty')
          if [ -n "$existing" ]; then
            comment_id=$(gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@comment.md --jq .id)
          else
            comment_id=$(gh api "repos/$REPO/issues/$NUMBER/comments" -X POST -F body=@comment.md --jq .id)
          fi
          echo "comment_url=${{ github.event.pull_request.html_url }}#issuecomment-$comment_id" >> "$GITHUB_OUTPUT"

  summary:
    needs: [address-book, spelling, coverage, advisory]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      SUMMARY_MARKER: "<!-- github-workflows-proposal-summary -->"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: .gh-workflows-summary
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Post the check summary comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
          RESULT_ADDRESS_BOOK: ${{ needs.address-book.result }}
          RESULT_SPELLING: ${{ needs.spelling.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_ADVISORY: ${{ needs.advisory.result }}
          DETAILS_ADDRESS_BOOK: ${{ needs.address-book.outputs.details }}
          DETAILS_SPELLING: ${{ needs.spelling.outputs.details }}
          DETAILS_COVERAGE: ${{ needs.coverage.outputs.uncovered_sample }}
          COVERAGE_PCT: ${{ needs.coverage.outputs.pct }}
          COVERAGE_MIN: ${{ needs.coverage.outputs.min_coverage }}
          ADVISORY_URL: ${{ needs.advisory.outputs.comment_url }}
        run: |
          jq -n \
            --arg ab "$RESULT_ADDRESS_BOOK" --arg sp "$RESULT_SPELLING" \
            --arg cov "$RESULT_COVERAGE" --arg adv "$RESULT_ADVISORY" \
            --arg ab_d "$DETAILS_ADDRESS_BOOK" --arg sp_d "$DETAILS_SPELLING" --arg cov_d "$DETAILS_COVERAGE" \
            --arg cov_pct "$COVERAGE_PCT" --arg cov_min "$COVERAGE_MIN" --arg adv_url "$ADVISORY_URL" \
            '{
              results: {"address-book": $ab, spelling: $sp, coverage: $cov, advisory: $adv},
              details: {"address-book": $ab_d, spelling: $sp_d, coverage: $cov_d},
              coverage_pct: $cov_pct, coverage_min: $cov_min, advisory_url: $adv_url
            }' > summary_payload.json
          python3 .gh-workflows-summary/render_summary_comment.py < summary_payload.json > summary_body.md || \
            echo "_summary rendering failed; see the job log for individual check results._" > summary_body.md
          if [ "$DRY_RUN" != "0" ]; then
            jq -nc --arg n "$NUMBER" '{would:"proposal-summary-comment",number:$n}' >&2
            exit 0
          fi
          { printf '%s\n' "$SUMMARY_MARKER"; cat summary_body.md; } > summary_comment.md
          existing=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" | jq -rs --arg m "$SUMMARY_MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.id]|max // empty') || true
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@summary_comment.md || true
          else
            gh api "repos/$REPO/issues/$NUMBER/comments" -X POST -F body=@summary_comment.md || true
          fi
