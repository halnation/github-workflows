name: ai-comment
on:
  pull_request:
    types: [opened, synchronize]
  issues:
    types: [opened]
jobs:
  ai:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: TokenLogic-com-au/github-workflows/.github/workflows/ai-comment.yml@0000000000000000000000000000000000000000
    with:
      kind: ${{ github.event_name == 'pull_request' && 'review' || 'scope' }}
      backend: openrouter
      dry_run: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
