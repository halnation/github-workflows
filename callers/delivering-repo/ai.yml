name: ai-comment
on:
  pull_request:
    types: [opened, synchronize]
  issues:
    types: [opened]
jobs:
  ai:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: TokenLogic-com-au/github-workflows/.github/workflows/ai-comment.yml@0000000000000000000000000000000000000000
    with:
      kind: ${{ github.event_name == 'pull_request' && 'review' || 'scope' }}
      backend: local
      dry_run: true
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      LOCAL_LLM_URL: ${{ secrets.LOCAL_LLM_URL }}
