name: pr-board
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      dry_run:
        type: boolean
        default: true
    secrets:
      BOARD_APP_PRIVATE_KEY:
        required: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository && (inputs.command != 'pr-issue-check' || github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
    steps:
      - name: Mint read-only app token (pr-issue-check)
        id: mint-ro
        if: inputs.command == 'pr-issue-check'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},General-Task,board-app
          permission-pull-requests: read
          permission-issues: read
          permission-contents: read
      - name: Mint app token (pr-sync)
        id: mint-full
        if: inputs.command == 'pr-sync'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},General-Task,board-app
      - name: Check out board-app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/board-app
          ref: 0000000000000000000000000000000000000000 # pin to the reviewed board-app commit before install
          path: board-app
          token: ${{ steps.mint-ro.outputs.token || steps.mint-full.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run board.py
        env:
          GH_TOKEN: ${{ steps.mint-ro.outputs.token || steps.mint-full.outputs.token }}
          COMMAND: ${{ inputs.command }}
        run: python3 board-app/board.py "$COMMAND" --event "$GITHUB_EVENT_PATH" --config board-app/config.json
